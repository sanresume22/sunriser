name: Build & test SunRiser
on: [push, workflow_dispatch]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -B build -A x64 -DSUNRISER_BUILD_TESTS=ON
      - run: cmake --build build --config Release --target SunRiser_VST3 SunRiser_Standalone SunRiserTest

      - name: Test - render, timing, reverse swell, save/restore, GUI
        run: build/SunRiserTest_artefacts/Release/SunRiserTest.exe test-output

      - name: Test - pluginval (strictness 7)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 7 --skip-gui-tests --validate "build/SunRiser_artefacts/Release/VST3/SunRiser.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: SunRiser-Windows
          path: |
            build/SunRiser_artefacts/Release/VST3/SunRiser.vst3
            build/SunRiser_artefacts/Release/Standalone/SunRiser.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-output-Windows
          path: test-output

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - run: cmake -B build -G Xcode -DSUNRISER_BUILD_TESTS=ON
      - run: cmake --build build --config Release --target SunRiser_VST3 SunRiser_AU SunRiser_Standalone SunRiserTest -- -quiet
      - name: Ad-hoc sign
        run: |
          for p in build/SunRiser_artefacts/Release/VST3/SunRiser.vst3 build/SunRiser_artefacts/Release/AU/SunRiser.component build/SunRiser_artefacts/Release/Standalone/SunRiser.app; do
            codesign --force --deep -s - "$p"
          done

      - name: Test - render, timing, reverse swell, save/restore, GUI
        run: build/SunRiserTest_artefacts/Release/SunRiserTest test-output

      - name: Test - pluginval VST3 (strictness 7)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 7 --skip-gui-tests --validate build/SunRiser_artefacts/Release/VST3/SunRiser.vst3

      - name: Test - Apple auval (what Logic Pro runs)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/SunRiser_artefacts/Release/AU/SunRiser.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -v aumu SnRs Snny

      - name: Zip (keeps bundle structure)
        run: |
          cd build/SunRiser_artefacts/Release
          ditto -c -k --keepParent VST3/SunRiser.vst3 $GITHUB_WORKSPACE/SunRiser-VST3-mac.zip
          ditto -c -k --keepParent AU/SunRiser.component $GITHUB_WORKSPACE/SunRiser-AU-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SunRiser-macOS
          path: |
            SunRiser-VST3-mac.zip
            SunRiser-AU-mac.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-output-macOS
          path: test-output
